run:
  random_seed: 42
  log_level: INFO               # DEBUG, INFO, or WARNING
  output_dir: runs              # where pipeline outputs are saved
  fmt: parquet                  # parquet (recommended) or csv

# Analytic sample thresholds
# Participants below min_valid_rar_days are excluded from IS computation
# and from the primary analytic sample (RAR is the binding constraint).
# Participants below sensitivity_rar_days are excluded from all analyses.
# See Methods section 2.2 for justification.
# ROCKET feature extraction window
# Covers full nocturnal period — override suggest_rocket_window() output
rocket:
  window_start: "22:00"   # 22:00 covers pre-sleep activity signal
  window_end:   "08:00"   # 08:00 covers full night including late risers
  n_kernels:    1000

#analytic_sample:
#  min_valid_rar_days: 5         # primary sample (IS stable, 74.5% of cohort)
#  sensitivity_rar_days: 3       # sensitivity sample (84.0% of cohort)
#  min_dreem_nights: 3           # minimum Dreem nights required
#  min_diary_nights: 3           # minimum diary nights required
#
analytic_sample:
  min_valid_rar_days: 5
  min_aligned_nights: 5
  min_qual_mean: 0.5
  qual_mean_exceptions:
    - "SP0091665"  # n=17, qual_min=0.41 (no single bad night), N3%=30.5 above clean-group mean


# Paths to supporting knowledge files
heuristics_path: configs/heuristics.toml
kb_path: knowledge_base
devices_path: configs/devices.yaml
