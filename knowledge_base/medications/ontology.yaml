# -----------------------------------------------------------------------
# Net effect rules for polypharmacy combinations
# -----------------------------------------------------------------------
combination_rules:

  stimulant_plus_alpha2:
    classes: ["stimulant", "alpha2_agonist"]
    net_sol_effect: "opposing"
    net_description: >
      Stimulant delays SOL; alpha-2 agonist promotes SOL. Net effect
      on sleep onset is uncertain and patient-specific. Cannot reliably
      attribute elevated SOL to either drug in isolation.
    rule_action: "abstain_complex_polypharmacy"

  stimulant_plus_melatonin:
    classes: ["stimulant", "melatonin"]
    net_sol_effect: "opposing"
    net_description: >
      Stimulant delays SOL; melatonin advances it. Melatonin was
      likely prescribed specifically to counteract stimulant-related
      onset delay. Elevated SOL despite both = refractory onset delay.
    rule_action: "strengthen_SOL_signal"
    clinical_note: >
      This combination is clinically meaningful. A participant on
      both a stimulant and melatonin who STILL has SOL > 45 min
      has a more severe sleep onset problem than the raw SOL suggests.

  ssri_plus_stimulant:
    classes: ["ssri", "stimulant"]
    net_sol_effect: "delays"
    net_description: >
      Both classes can delay or disrupt sleep. Combined effect
      may be additive for SOL disruption. REM suppression from
      SSRI confounds N3/REM architecture labels.
    rule_action: "abstain_if_SOL_elevated"

  alpha2_only:
    classes: ["alpha2_agonist"]
    net_sol_effect: "advances"
    net_description: >
      Guanfacine alone is sedating and promotes sleep onset.
      Does not confound SOL elevation — if SOL is elevated
      despite guanfacine, it is a genuine sleep onset difficulty.
    rule_action: "label_normally"