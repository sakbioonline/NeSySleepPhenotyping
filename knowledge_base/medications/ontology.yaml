# Medication Ontology for NeSy Sleep Phenotyping
# -----------------------------------------------------------------------
# Maps observed medication names (including misspellings and variants)
# to canonical drug entries with pharmacological class, known sleep
# effects, and temporal characteristics.
#
# Clinical grounding
# ------------------
# Sleep effect profiles are grounded in published pharmacology:
#   [1] Cortese S et al. (2013). Sleep in children with ADHD.
#       Sleep Medicine Reviews, 17(4):291-301.
#   [2] Stahl SM. (2021). Stahl's Essential Psychopharmacology, 5th ed.
#   [3] Becker PM. (2006). Pharmacologic and nonpharmacologic treatments
#       of insomnia. Neurologic Clinics, 23(1):1191-1215.
#   [4] Robillard R et al. (2011). Sleep-wake cycle and melatonin rhythms
#       in adolescents. Chronobiology International.
#
# Temporal classification
# -----------------------
# night_specific:   Effect concentrated on the night of administration.
#                   Meaningful to track per night (e.g. melatonin).
# same_day_residual: Taken during the day; residual effect affects that
#                   night's sleep due to pharmacokinetic half-life.
# chronic:          Half-life measured in days/weeks. Night-level
#                   variation is not meaningful — presence across the
#                   study period defines the medication context.
# -----------------------------------------------------------------------

meta:
  version: "1.0.0"
  population: "adolescents 10-17"
  purpose: >
    Provides the pharmacological knowledge base for medication-aware
    sleep phenotyping. Medication entries are used by the medication
    parser to classify diary entries and generate per-night medication
    context flags that modify symbolic labelling rule behaviour.

# -----------------------------------------------------------------------
# Drug classes and their net sleep effects
# -----------------------------------------------------------------------
drug_classes:

  stimulant:
    label: "CNS Stimulant"
    mechanism: >
      Dopamine and noradrenaline reuptake inhibition. Increases
      arousal and wakefulness; directly opposes sleep initiation.
    sleep_effects:
      SOL: "increases"       # delays sleep onset
      WASO: "may_increase"   # can cause nocturnal awakenings
      TST: "may_decrease"    # total sleep time often reduced
      REM: "may_suppress"    # some REM suppression at high doses
      circadian: "neutral"   # no direct circadian effect
    temporal_class: "same_day_residual"
    half_life_hours: [3, 14]  # range across variants
    rule_effect: "abstain_if_SOL_elevated"
    source: "[1] Cortese et al. 2013; [2] Stahl 2021"

  alpha2_agonist:
    label: "Alpha-2 Adrenergic Agonist"
    mechanism: >
      Reduces noradrenergic activity via presynaptic alpha-2
      receptor agonism. Sedating — often prescribed alongside
      stimulants to counteract their sleep-disrupting effects.
    sleep_effects:
      SOL: "decreases"       # promotes sleep onset
      WASO: "may_decrease"
      TST: "may_increase"
      REM: "neutral"
      circadian: "neutral"
    temporal_class: "same_day_residual"
    half_life_hours: [12, 18]
    rule_effect: "promotes_sleep_onset"
    source: "[2] Stahl 2021"

  ssri:
    label: "Selective Serotonin Reuptake Inhibitor"
    mechanism: >
      Inhibits serotonin reuptake. Chronic effects on sleep
      architecture — REM suppression is the most consistent finding.
      Acute effects vary; chronic use establishes a new baseline.
    sleep_effects:
      SOL: "variable"        # may increase or decrease depending on drug
      WASO: "may_increase"   # particularly with activating SSRIs
      TST: "variable"
      REM: "suppresses"      # consistent across all SSRIs
      circadian: "neutral"
    temporal_class: "chronic"
    half_life_hours: [24, 360]  # fluoxetine active metabolite up to 15 days
    rule_effect: "flag_rem_suppression"
    source: "[3] Becker 2006; [2] Stahl 2021"

  snri_nri:
    label: "Selective Noradrenaline Reuptake Inhibitor"
    mechanism: >
      Inhibits noradrenaline reuptake (and to a lesser degree
      serotonin). Atomoxetine (Strattera) is technically an NRI
      used as a non-stimulant ADHD treatment. Can be activating.
    sleep_effects:
      SOL: "may_increase"
      WASO: "may_increase"
      TST: "may_decrease"
      REM: "may_suppress"
      circadian: "neutral"
    temporal_class: "chronic"
    half_life_hours: [5, 21]
    rule_effect: "flag_mild_arousal"
    source: "[2] Stahl 2021"

  melatonin:
    label: "Melatonin (exogenous)"
    mechanism: >
      Exogenous melatonin supplementation. At standard doses (1–5mg)
      advances circadian phase and promotes sleep onset. Commonly
      prescribed in autistic adolescents specifically for delayed
      sleep onset.
    sleep_effects:
      SOL: "decreases"       # primary therapeutic effect
      WASO: "neutral"        # minimal effect on maintenance
      TST: "may_increase"    # secondary to earlier onset
      REM: "neutral"
      circadian: "advances"  # advances the circadian phase
    temporal_class: "night_specific"
    half_life_hours: [0.5, 1]
    rule_effect: "strengthen_SOL_signal"
    clinical_note: >
      Melatonin is taken BECAUSE the participant has a sleep onset
      problem. Elevated SOL despite melatonin is a STRONGER signal
      for sleep onset difficulty, not a reason to abstain. A
      participant on melatonin 5mg with SOL > 45 min has
      treatment-refractory sleep onset delay.
    source: "[4] Robillard et al. 2011; [2] Stahl 2021"

  non_psychotropic:
    label: "Non-psychotropic / Sleep-neutral medication"
    mechanism: >
      Medications with no direct or established effect on sleep
      architecture, sleep onset, or circadian timing. Includes
      antibiotics, antifungals, hormones (insulin, levothyroxine),
      analgesics, and supplements (probiotics).
    sleep_effects:
      SOL: "neutral"
      WASO: "neutral"
      TST: "neutral"
      REM: "neutral"
      circadian: "neutral"
    temporal_class: "night_specific"
    rule_effect: "no_modification"
    note: >
      Levothyroxine at supra-therapeutic doses can cause insomnia,
      but at standard replacement doses (e.g. 88mcg) effects are
      minimal. Treat as neutral unless dose is flagged as excessive.

# -----------------------------------------------------------------------
# Individual drug entries — canonical name, variants, class mapping
# -----------------------------------------------------------------------
drugs:

  # -- Stimulants --

  vyvanse:
    canonical_name: "Vyvanse"
    generic_name: "lisdexamfetamine"
    drug_class: "stimulant"
    variants:
      - "Vyvanse"
      - "vyvanse"
      - "Vyvsnse"
      - "Vyvance"
      - "vyvance"
      - "Vyvan"
    typical_dose_range_mg: [20, 70]
    half_life_hours: 11
    notes: >
      Prodrug — converted to dexamphetamine. Long-acting stimulant
      with substantial residual effect on evening sleep onset even
      when taken in the morning. Among the strongest SOL-disrupting
      stimulants in common use.

  methylphenidate:
    canonical_name: "Ritalin"
    generic_name: "methylphenidate"
    drug_class: "stimulant"
    variants:
      - "Ritalin"
      - "ritalin"
      - "Ritalin "
      - "methylphenidate"
    typical_dose_range_mg: [5, 60]
    half_life_hours: 3.5
    notes: >
      Short-acting formulation. Half-life ~3-4 hours. If taken as a
      morning/midday dose only, residual evening effect is modest.
      Afternoon top-up doses significantly delay SOL.

  focalin:
    canonical_name: "Focalin"
    generic_name: "dexmethylphenidate"
    drug_class: "stimulant"
    variants:
      - "Focalin"
      - "focalin"
      - "Focalin "
      - "Foclin"
      - "foclin"
    typical_dose_range_mg: [5, 30]
    half_life_hours: 3
    notes: >
      d-enantiomer of methylphenidate. More potent per mg than
      racemic methylphenidate. Similar short half-life profile.

  # -- Alpha-2 agonists --

  guanfacine:
    canonical_name: "Guanfacine"
    generic_name: "guanfacine"
    drug_class: "alpha2_agonist"
    variants:
      - "Guanfacine"
      - "guanfacine"
      - "Guanfacine "
      - "Gaunfacine"
      - "gaunfacine"
      - "IC guanfacine"
      - "Intuniv"
      - "intuniv"
      - "Intuni"
    typical_dose_range_mg: [1, 4]
    half_life_hours: 17
    notes: >
      Extended-release (Intuniv) and immediate-release forms both
      used. Often prescribed alongside stimulants to counteract
      sleep disruption. Sedating — can improve SOL when taken
      in the evening. Net effect with concurrent stimulant: opposing.

  # -- SSRIs --

  fluoxetine:
    canonical_name: "Fluoxetine"
    generic_name: "fluoxetine"
    drug_class: "ssri"
    variants:
      - "Fluoxetine"
      - "fluoxetine"
      - "Fluoxetine "
    typical_dose_range_mg: [10, 40]
    half_life_hours: 360   # active metabolite norfluoxetine: up to 15 days
    notes: >
      Longest half-life SSRI. Activating profile — more likely to
      cause insomnia than sedating SSRIs. REM suppression is
      consistent and substantial.

  sertraline:
    canonical_name: "Zoloft"
    generic_name: "sertraline"
    drug_class: "ssri"
    variants:
      - "Zoloft"
      - "zoloft"
      - "Zoloft "
      - "Zoloft,"
      - "sertraline"
    typical_dose_range_mg: [25, 100]
    half_life_hours: 26
    notes: >
      Moderate half-life SSRI. Less activating than fluoxetine.
      REM suppression present but typically less marked.

  # -- SNRIs / NRIs --

  atomoxetine:
    canonical_name: "Strattera"
    generic_name: "atomoxetine"
    drug_class: "snri_nri"
    variants:
      - "Strattera"
      - "strattera"
      - "Strattera "
    typical_dose_range_mg: [18, 100]
    half_life_hours: 5
    notes: >
      Non-stimulant ADHD medication. Noradrenaline reuptake
      inhibitor. Can be activating — may delay SOL particularly
      in the first weeks of treatment. Chronic use effects are
      more modest.

  # -- Melatonin --

  melatonin:
    canonical_name: "Melatonin"
    generic_name: "melatonin"
    drug_class: "melatonin"
    variants:
      - "Melatonin"
      - "melatonin"
      - "Melatonin "
    typical_dose_range_mg: [1, 10]
    half_life_hours: 0.75
    notes: >
      Night-specific. Presence signals that the participant or
      clinician identified a sleep onset problem. Elevated SOL
      despite melatonin = treatment-refractory onset delay.

  # -- Non-psychotropic --

